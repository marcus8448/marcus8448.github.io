{{- define "main" -}}
<header class="post-heading">
  <h1>{{ .Title }}</h1>
  <time class="date-meta" datetime='{{ .PublishDate | time.Format "2006-01-02" }}'>{{ .PublishDate | time.Format ":date_long" }}</time>
</header>
<div class="content">
  {{ .Content }}
</div>
{{- end -}}

{{- define "css" -}}
{{- partial "css.html" "page.css" "page.css" -}}
{{- partial "css.html" "code.css" "code.css" -}}
{{- end -}}
