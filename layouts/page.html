{{- define "main" -}}
<hgroup class="post-heading">
  <h1>{{ .Title }}</h1>
  <p class="date-meta"><time datetime='{{ .PublishDate | time.Format "2006-01-02" }}'>{{ .PublishDate | time.Format ":date_long" }}</time></p>
</hgroup>
<div class="content">
  {{ .Content }}
</div>
{{- end -}}

{{- define "css" -}}
{{- partial "css.html" "page.css" "page.css" -}}
{{- partial "css.html" "code.css" "code.css" -}}
{{- end -}}
